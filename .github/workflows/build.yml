name: Build & Release

# 触发方式:
#   1. 打 tag（v24.10.6 / v25.12.2 ...）→ 构建该版本并发布
#   2. 手动触发（workflow_dispatch），指定版本
#   3. 每天定时（北京时间 00:00）→ 自动检测"官方已发版 + 本仓库有配置 + 尚未发布"的版本并构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 ImmortalWrt 版本（本仓库需已有 config/<版本>.config）'
        required: true
  schedule:
    - cron: '0 16 * * *'

jobs:
  detect:
    name: 检测要构建的版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # 定时任务：找"官方已发版 + 本仓库有配置 + 尚未发布"的版本
            for c in config/*.config; do
              [ -e "$c" ] || continue
              v=$(basename "$c" .config)
              git ls-remote --tags origin "refs/tags/v$v" >/dev/null 2>&1 && continue
              git ls-remote --tags https://github.com/immortalwrt/immortalwrt.git "refs/tags/v$v" >/dev/null 2>&1 || continue
              echo "检测到官方已发布 v$v，开始自动构建"
              echo "version=$v" >> "$GITHUB_OUTPUT"
              break
            done
          fi
          if ! grep -q '^version=' "$GITHUB_OUTPUT" 2>/dev/null; then
            echo "::notice::没有可构建的版本（未检测到官方新版本，或缺少 config/<版本>.config）"
          fi

  build:
    name: 构建并发布
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: [self-hosted, linux]
    timeout-minutes: 720
    env:
      http_proxy: http://192.168.101.1:9001
      https_proxy: http://192.168.101.1:9001
      no_proxy: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - name: 清理旧构建目录（释放磁盘）
        run: |
          mkdir -p "$HOME/iwrt-build"
          for d in "$HOME"/iwrt-build/iwrt-*; do
            [ -d "$d" ] || continue
            [ "$d" = "$HOME/iwrt-build/iwrt-${{ needs.detect.outputs.version }}" ] && continue
            echo "删除旧构建目录: $d"
            rm -rf "$d"
          done
      - name: 构建固件
        run: |
          ./scripts/build.sh "${{ needs.detect.outputs.version }}" 2
      - name: 发布到 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release.sh "${{ needs.detect.outputs.version }}"
